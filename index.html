<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0810">
<title>ALBAIN HORROR</title>
<style>
:root{
  --bg:#08060c; --bg2:#120d1c; --panel:#171126ee; --panel2:#1d1730;
  --accent:#8b3cf5; --accent2:#c93cf5; --danger:#c22b3c; --danger2:#ff4d5e;
  --text:#e9e3f7; --textdim:#9c93b8; --gold:#e8c65a; --good:#3fcf7f;
  --fog-opacity:.35; --radius:14px; --fsz:1rem;
  --shadow: 0 10px 40px rgba(0,0,0,.6);
}
body.halloween{
  --bg:#0b0500; --bg2:#170a02; --panel:#1c0f04ee; --panel2:#26150a;
  --accent:#ff7a1a; --accent2:#ffb300; --danger:#8b1e1e; --danger2:#ff4d1a;
  --gold:#ffb300; --good:#7ee06b;
}
body.contrast-high{
  --text:#ffffff; --textdim:#dcdcdc; --panel:#000000f0; --panel2:#0d0d0d;
}
body.text-large{ --fsz:1.18rem; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:radial-gradient(ellipse at 50% 0%, var(--bg2), var(--bg) 70%);
  color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:var(--fsz); overflow-x:hidden; min-height:100vh;
  -webkit-user-select:none; user-select:none;
}
#app{ min-height:100vh; display:flex; flex-direction:column; position:relative; }

/* ---------- fog / rain / particles overlays ---------- */
#fx-layer{position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden;}
.fog{position:absolute; inset:-20% -20%; background:
  radial-gradient(ellipse at 20% 80%, rgba(139,60,245,.10), transparent 60%),
  radial-gradient(ellipse at 80% 20%, rgba(0,0,0,.4), transparent 60%);
  opacity:var(--fog-opacity); animation:drift 40s linear infinite;}
body.halloween .fog{background:
  radial-gradient(ellipse at 20% 80%, rgba(255,122,26,.12), transparent 60%),
  radial-gradient(ellipse at 80% 20%, rgba(0,0,0,.5), transparent 60%);}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(-3%,2%)}100%{transform:translate(0,0)}}
.rain{position:absolute; inset:0; background-image:repeating-linear-gradient(100deg, rgba(200,200,255,.07) 0 1px, transparent 1px 40px); animation:rainfall .35s linear infinite; opacity:.5;}
@keyframes rainfall{from{background-position-y:0}to{background-position-y:40px}}
.grain{position:absolute; inset:0; opacity:.045; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
.vignette{position:absolute; inset:0; box-shadow:inset 0 0 220px rgba(0,0,0,.85);}
.flicker{animation:flick 6s infinite;}
@keyframes flick{0%,19%,21%,23%,55%,100%{opacity:1}20%,22%,54%{opacity:.75}}
.reduce-fx .fog,.reduce-fx .rain,.reduce-fx .grain{display:none;}

.pumpkin,.leaf,.bat{position:absolute; pointer-events:none; opacity:.85; filter:drop-shadow(0 0 8px rgba(255,150,30,.5));}
@keyframes floaty{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(4deg)}100%{transform:translateY(0) rotate(0deg)}}
@keyframes fall{0%{transform:translateY(-10vh) translateX(0) rotate(0)}100%{transform:translateY(110vh) translateX(40px) rotate(360deg)}}

/* ---------- layout ---------- */
.screen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px 40px; position:relative; z-index:10; min-height:100vh;}
.wrap{ width:100%; max-width:640px; }

/* Title */
.title-main{ text-align:center; margin-bottom:6px; }
.title-main h1{
  font-size:clamp(2.1rem,9vw,3.4rem); margin:0; letter-spacing:3px;
  color:var(--gold); text-shadow:0 0 18px var(--accent2), 0 0 40px rgba(0,0,0,.8);
  font-weight:800;
}
.title-main .sub{ color:var(--textdim); font-style:italic; margin-top:6px; font-size:.95rem; letter-spacing:1px;}

/* Buttons */
.btn{
  display:block; width:100%; text-align:center; padding:16px 18px; margin:9px 0;
  background:linear-gradient(180deg,var(--panel2),var(--panel)); color:var(--text);
  border:1px solid rgba(255,255,255,.08); border-radius:var(--radius); font-size:1.02rem;
  cursor:pointer; letter-spacing:.5px; touch-action:manipulation; font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,.4); transition:transform .12s, box-shadow .12s, border-color .12s;
  min-height:52px;
}
.btn:active{ transform:scale(.97); }
.btn.primary{ background:linear-gradient(180deg,var(--accent2),var(--accent)); border-color:transparent; color:#100518;}
.btn.ghost{ background:transparent; border:1px solid rgba(255,255,255,.15); }
.btn.small{ padding:10px 12px; font-size:.85rem; min-height:40px;}
.btn.danger{ background:linear-gradient(180deg,var(--danger2),var(--danger)); border-color:transparent;}
.btn:disabled{ opacity:.4; pointer-events:none; }
.btn-row{ display:flex; gap:10px; }
.btn-row .btn{ flex:1; }

.menu-badge{ text-align:center; color:var(--gold); font-size:.8rem; margin-bottom:14px; letter-spacing:2px; opacity:.8;}

/* Panel / card */
.panel{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); backdrop-filter:blur(6px);}
.panel h2{ margin-top:0; color:var(--gold); letter-spacing:1px; font-size:1.15rem;}
.panel h3{ color:var(--accent2); margin:14px 0 6px; font-size:1rem;}
.small-note{ color:var(--textdim); font-size:.82rem; line-height:1.4;}

/* HUD */
.hud{ display:flex; align-items:center; justify-content:space-between; width:100%; max-width:640px; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.hearts{ font-size:1.3rem; letter-spacing:3px;}
.hud .badge{ background:var(--panel2); padding:6px 12px; border-radius:20px; font-size:.82rem; border:1px solid rgba(255,255,255,.08);}
.progressbar{ height:6px; width:100%; background:#1b1526; border-radius:6px; overflow:hidden; margin:8px 0 16px;}
.progressbar > div{ height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .4s; }

/* ============ Cinematic engine (parallax / Ken Burns / particules / secousses) ============ */
.cine{ position:fixed; inset:0; background:#000; z-index:200; overflow:hidden; }
.cine-stage{ position:absolute; inset:0; overflow:hidden; }
.cine-stage.shake-active{ animation:camshake .5s; }
@keyframes camshake{
  0%{transform:translate(0,0)} 10%{transform:translate(-6px,3px)} 20%{transform:translate(5px,-4px)}
  30%{transform:translate(-4px,4px)} 40%{transform:translate(6px,-2px)} 50%{transform:translate(-3px,3px)}
  60%{transform:translate(4px,-3px)} 70%{transform:translate(-2px,2px)} 80%{transform:translate(3px,-1px)}
  90%{transform:translate(-1px,1px)} 100%{transform:translate(0,0)}
}
.cine-layer-far,.cine-layer-near{ position:absolute; inset:-6%; width:112%; height:112%; }
.cine-layer-far svg,.cine-layer-near svg{ width:100%; height:100%; display:block; }
.cine-layer-far{ z-index:1; opacity:.85; }
.cine-layer-near{ z-index:2; }
.kenburns-a{ animation:kbA 16s ease-in-out infinite alternate; }
.kenburns-b{ animation:kbB 13s ease-in-out infinite alternate; }
@keyframes kbA{ from{transform:scale(1) translate(0,0)} to{transform:scale(1.1) translate(-2%,-1%)} }
@keyframes kbB{ from{transform:scale(1.04) translate(1%,0)} to{transform:scale(1.18) translate(-1.5%,-2%)} }
.reduce-fx .kenburns-a,.reduce-fx .kenburns-b{ animation:none !important; }
.cine-photo{ position:absolute; inset:-6%; width:112%; height:112%; object-fit:cover; z-index:3; filter:brightness(.72) saturate(1.05); background:#000; opacity:0; transition:opacity .5s ease; }
.cine-photo.kb{ animation:kbPhoto 6.5s ease-out forwards; }
@keyframes kbPhoto{ from{transform:scale(1.04)} to{transform:scale(1.14)} }
.reduce-fx .cine-photo{ filter:brightness(.8) saturate(1.02); }
.reduce-fx .cine-photo.kb{ animation:none !important; }
.cine-particles-canvas{ position:absolute; inset:0; z-index:5; pointer-events:none; width:100%; height:100%;}
.cine-vignette-local{ position:absolute; inset:0; z-index:6; pointer-events:none; box-shadow:inset 0 0 26vw rgba(0,0,0,.85); background:radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,.5) 100%);}
.cine .radio{ color:var(--gold); font-weight:700; letter-spacing:1px; }
.cine-subtitle-wrap{ position:absolute; left:0; right:0; bottom:12%; z-index:15; display:flex; justify-content:center; padding:0 22px; pointer-events:none;}
.cine-subtitle{ max-width:680px; text-align:center; padding:12px 18px; border-radius:10px;
  font-size:clamp(1.02rem,4.4vw,1.45rem); line-height:1.55; color:var(--text);
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.6) 35%);
  opacity:0; transform:translateY(10px); animation:subIn .7s forwards; text-shadow:0 2px 10px rgba(0,0,0,.9);}
.cine-subtitle.radio{ color:var(--gold); }
@keyframes subIn{ to{opacity:1; transform:translateY(0);} }
.cine .skip{ position:absolute; bottom:26px; right:26px; z-index:30; color:var(--textdim); font-size:.85rem; border:1px solid rgba(255,255,255,.25); padding:8px 16px; border-radius:20px; cursor:pointer; background:rgba(0,0,0,.35);}
.cine .levellabel{ position:absolute; top:34px; left:50%; transform:translateX(-50%); z-index:22; color:var(--accent2); letter-spacing:3px; font-size:.8rem; text-transform:uppercase; text-shadow:0 2px 8px rgba(0,0,0,.9);}
.cine .lightning{ position:absolute; inset:0; z-index:40; background:#fff; opacity:0; pointer-events:none;}
.cine .lightning.on{ animation:strike .22s;}
@keyframes strike{0%{opacity:.92}100%{opacity:0}}
.cine-bar{ position:absolute; left:0; right:0; height:0; background:#000; z-index:25; transition:height .55s ease; pointer-events:none;}
.cine-bar.top{ top:0; } .cine-bar.bottom{ bottom:0; }
.cine.letterboxed .cine-bar{ height:8.5%; }
.clockbig{ font-size:clamp(2rem,10vw,4rem); font-weight:800; color:var(--gold); letter-spacing:4px; text-shadow:0 0 30px var(--accent2);}

/* Question / gameplay */
.scene-flavor{ color:var(--textdim); font-style:italic; margin-bottom:10px; line-height:1.5; font-size:.92rem; border-left:3px solid var(--accent); padding-left:12px;}
.question-cat{ display:inline-block; font-size:.72rem; letter-spacing:1px; padding:3px 10px; border-radius:20px; margin-bottom:10px; }
.question-cat.route{ background:#2a1c46; color:#c9a6ff;}
.question-cat.secours{ background:#3a1414; color:#ff9c9c;}
.question-text{ font-size:1.12rem; font-weight:600; margin-bottom:16px; line-height:1.4;}
.answers{ display:flex; flex-direction:column; gap:10px;}
.ans-btn{
  text-align:left; padding:14px 16px; border-radius:12px; border:1px solid rgba(255,255,255,.12);
  background:var(--panel2); color:var(--text); cursor:pointer; font-size:.98rem; line-height:1.35;
  min-height:52px; display:flex; align-items:center; gap:10px; transition:all .15s;
}
.ans-btn:active{ transform:scale(.985); }
.ans-btn .letter{ background:rgba(255,255,255,.08); border-radius:50%; width:26px; height:26px; min-width:26px; display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700;}
.ans-btn.correct{ background:#153a24; border-color:var(--good); }
.ans-btn.wrong{ background:#3a1418; border-color:var(--danger2); }
.ans-btn.disabled{ opacity:.55; pointer-events:none; }

.feedback{ margin-top:16px; padding:16px; border-radius:12px; }
.feedback.ok{ background:#0f2a1c; border:1px solid var(--good); }
.feedback.ko{ background:#2a0f14; border:1px solid var(--danger2); }
.feedback .head{ font-weight:800; letter-spacing:1px; margin-bottom:6px;}
.feedback .head.ok{ color:var(--good);}
.feedback .head.ko{ color:var(--danger2);}
.feedback .exp{ font-size:.92rem; line-height:1.5; color:var(--text);}

.streak{ color:var(--gold); font-size:.85rem; text-align:center; margin-top:8px; min-height:18px;}

/* Defeat/Victory */
.bigicon{ font-size:3.4rem; text-align:center; margin-bottom:8px;}
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0;}
.stat-box{ background:var(--panel2); border-radius:10px; padding:12px; text-align:center;}
.stat-box .val{ font-size:1.4rem; font-weight:800; color:var(--gold);}
.stat-box .lab{ font-size:.72rem; color:var(--textdim); letter-spacing:.5px;}

/* Settings */
.setting-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.06); gap:10px;}
.setting-row label{ font-size:.92rem;}
input[type=range]{ width:130px; accent-color:var(--accent2);}
.toggle{ width:50px; height:28px; border-radius:16px; background:#2a2340; position:relative; cursor:pointer; border:1px solid rgba(255,255,255,.1); flex-shrink:0;}
.toggle.on{ background:var(--accent);}
.toggle span{ position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .18s;}
.toggle.on span{ left:24px;}
.seg{ display:flex; gap:6px; }
.seg button{ flex:1; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,.12); background:var(--panel2); color:var(--textdim); font-size:.8rem; cursor:pointer;}
.seg button.active{ background:var(--accent); color:#fff; border-color:transparent;}

.top-back{ position:fixed; top:14px; left:14px; z-index:60; background:var(--panel2); border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:8px 14px; font-size:.85rem; cursor:pointer; color:var(--text);}

.modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{ background:var(--panel); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:22px; max-width:420px; width:100%;}

.orient-hint{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--accent); padding:10px 16px; border-radius:20px; font-size:.8rem; z-index:250; display:none;}
@media (orientation:portrait){ body.suggest-landscape .orient-hint{display:block;} }

.collection-item{ background:var(--panel2); border-radius:10px; padding:12px 14px; margin-bottom:8px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
.collection-item.locked{ opacity:.4; cursor:default;}

footer.credits{ text-align:center; color:var(--textdim); font-size:.7rem; margin-top:18px; opacity:.6;}

@media (min-width:700px){
  .wrap{ max-width:680px; }
}
</style>
</head>
<body>
<div id="fx-layer">
  <div class="fog flicker"></div>
  <div class="rain" id="fxRain"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div id="fxHalloweenExtra"></div>
</div>
<div class="orient-hint" id="orientHint">📱 Tournez votre téléphone pour une meilleure expérience</div>
<div id="app"></div>

<script>
/* =========================================================================
   ALBAIN HORROR — moteur de jeu (single-file)
   Contenu pédagogique extrait fidèlement du "Livret de Vérifications BMW
   Série 1" (questions Sécurité Routière / QSER et Premiers Secours / 1erS).
   ========================================================================= */

/* --------------------------- BASE DE QUESTIONS --------------------------- */
// cat: 'route' (sécurité routière) | 'secours' (premiers secours)
const QUESTIONS = [
// ---- SÉCURITÉ ROUTIÈRE ----
{id:'r1',cat:'route',dif:1,
 q:"Pourquoi doit-on régler la hauteur des feux avant de circuler ?",
 a:["Pour ne pas éblouir les autres usagers.","Pour économiser la batterie du véhicule.","Pour améliorer la consommation de carburant.","Pour activer automatiquement le régulateur de vitesse."],
 c:0, exp:"Un mauvais réglage de la hauteur des feux peut éblouir les autres usagers de la route."},
{id:'r2',cat:'route',dif:1,
 q:"Comment peut-on détecter l'usure des balais d'essuie-glaces en circulation ?",
 a:["En cas de pluie, lorsqu'ils laissent des traces sur le pare-brise.","Lorsqu'ils font du bruit au démarrage du moteur.","Lorsque le voyant moteur s'allume.","Ils ne s'usent jamais, seul un contrôle visuel compte."],
 c:0, exp:"Des traces laissées sur le pare-brise par temps de pluie signalent des balais usés, source de mauvaise visibilité."},
{id:'r3',cat:'route',dif:1,
 q:"Quelle peut être la conséquence d'une panne de dégivrage de la lunette arrière ?",
 a:["Une insuffisance ou une absence de visibilité vers l'arrière.","Une surchauffe du moteur.","Un déclenchement intempestif des airbags.","Une décharge rapide de la batterie."],
 c:0, exp:"Sans dégivrage fonctionnel, la visibilité vers l'arrière du véhicule peut être insuffisante, voire nulle."},
{id:'r4',cat:'route',dif:1,
 q:"Dans quels cas doit-on utiliser les feux de détresse ?",
 a:["En cas de panne, d'accident, ou de ralentissement important.","Uniquement la nuit, en agglomération.","Pour se garer sur une place réservée.","À chaque changement de direction."],
 c:0, exp:"Les feux de détresse signalent une panne, un accident ou un ralentissement important aux autres usagers."},
{id:'r5',cat:'route',dif:2,
 q:"Sans actionner la commande du régulateur de vitesse, comment le désactiver rapidement ?",
 a:["En appuyant sur la pédale de frein ou d'embrayage.","En coupant complètement le contact.","En actionnant les feux de détresse.","En relâchant l'accélérateur durant 10 secondes."],
 c:0, exp:"Une simple pression sur le frein ou l'embrayage désactive immédiatement le régulateur de vitesse."},
{id:'r6',cat:'route',dif:1,
 q:"Dans quel cas peut-on utiliser l'avertisseur sonore en agglomération ?",
 a:["En cas de danger immédiat.","Pour saluer un autre conducteur.","Pour signaler un dépassement de nuit.","À n'importe quel moment de la journée."],
 c:0, exp:"En agglomération, l'avertisseur sonore ne doit être utilisé qu'en cas de danger immédiat."},
{id:'r7',cat:'route',dif:2,
 q:"Dans quelle situation doit-on désactiver l'airbag du passager avant ?",
 a:["Lors du transport d'un enfant à l'avant, dans un siège auto dos à la route.","Lorsqu'il pleut fortement.","Lorsque le véhicule roule sur autoroute.","Lorsque la ceinture arrière n'est pas bouclée."],
 c:0, exp:"Un airbag actif face à un siège dos à la route en cas de choc peut gravement blesser l'enfant : il faut le désactiver."},
{id:'r8',cat:'route',dif:1,
 q:"Peut-on utiliser les feux de brouillard arrière par forte pluie ?",
 a:["Non.","Oui, systématiquement.","Oui, mais seulement la nuit.","Uniquement sur autoroute."],
 c:0, exp:"Les feux de brouillard arrière sont réservés aux situations de brouillard ou de neige, pas à la forte pluie."},
{id:'r9',cat:'route',dif:1,
 q:"Quel est le risque de maintenir les feux de route allumés lors d'un croisement avec d'autres usagers ?",
 a:["Un risque d'éblouissement des autres usagers.","Une décharge de la batterie.","Un risque de surchauffe des phares.","Aucun risque particulier."],
 c:0, exp:"Les feux de route doivent être basculés en feux de croisement pour ne pas éblouir les usagers croisés."},
{id:'r10',cat:'route',dif:1,
 q:"Quelle est l'utilité d'un limiteur de vitesse ?",
 a:["Ne pas dépasser la vitesse programmée par le conducteur.","Maintenir automatiquement une vitesse constante.","Réduire la consommation de carburant.","Empêcher le démarrage au-delà d'une certaine vitesse du vent."],
 c:0, exp:"Le limiteur de vitesse empêche le véhicule de dépasser la vitesse choisie par le conducteur, sans la maintenir constante."},
{id:'r11',cat:'route',dif:1,
 q:"En cas de panne ou d'accident, quel accessoire de sécurité est obligatoire en plus du gilet de haute visibilité ?",
 a:["Le triangle de présignalisation.","Une trousse de secours.","Un extincteur.","Une couverture de survie."],
 c:0, exp:"Le triangle de présignalisation est l'autre accessoire de sécurité obligatoire en cas de panne ou d'accident."},
{id:'r12',cat:'route',dif:2,
 q:"À partir de quel taux d'alcool est-on en infraction en période de permis probatoire ?",
 a:["0,20 g/l de sang, c'est-à-dire 0 verre.","0,50 g/l de sang, soit environ 2 verres.","0,80 g/l de sang, soit environ 3 verres.","1,00 g/l de sang, soit environ 4 verres."],
 c:0, exp:"En période probatoire, le seuil est de 0,20 g/l de sang : dès le premier verre, ce seuil peut être dépassé."},
{id:'r13',cat:'route',dif:1,
 q:"En cas d'accident, dans quel délai le constat amiable doit-il être transmis à l'assureur ?",
 a:["5 jours.","48 heures.","10 jours.","1 mois."],
 c:0, exp:"Le constat amiable doit être transmis à l'assureur dans un délai de 5 jours."},
{id:'r14',cat:'route',dif:1,
 q:"Pourquoi est-il important de bien régler son volant ?",
 a:["Pour le confort de conduite, l'accessibilité aux commandes et l'efficacité des airbags.","Pour éviter la formation de buée sur le pare-brise.","Pour réduire la consommation de carburant.","Pour activer automatiquement le régulateur de vitesse."],
 c:0, exp:"Un bon réglage du volant assure confort, accessibilité aux commandes, visibilité du tableau de bord et efficacité des airbags."},
{id:'r15',cat:'route',dif:2,
 q:"Peut-on fixer tous types de sièges enfant sur des attaches de type Isofix ?",
 a:["Non, uniquement ceux compatibles avec ce type d'attache.","Oui, tous les modèles sont compatibles.","Non, les attaches Isofix sont réservées aux adultes.","Oui, mais uniquement à l'avant du véhicule."],
 c:0, exp:"Seuls les sièges enfant compatibles avec le système Isofix peuvent y être fixés."},
{id:'r16',cat:'route',dif:1,
 q:"En règle générale, à partir de quel âge un enfant peut-il être installé sur le siège passager avant ?",
 a:["10 ans.","6 ans.","13 ans.","16 ans."],

/* --------------------------- SAUVEGARDE --------------------------- */
const SAVE_KEY = 'albainHorrorSaveV1';
function defaultSave(){
  return {
    progress:{unlockedLevel:1, bestScore:0, completed:false},
    halloween:{unlockedLevel:1, bestScore:0, openingSeen:false, completed:false},
    score:0,
    stats:{correct:0, wrong:0, gamesPlayed:0, bestStreak:0},
    cinematicsSeen:[], // keys
    settings:{musicVol:60, sfxVol:80, animations:true, reduceEffects:false, textSize:'normal', contrast:'normal'}
  };
}
let SAVE = loadSave();
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultSave();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultSave(), parsed, {
      progress:Object.assign(defaultSave().progress, parsed.progress||{}),
      halloween:Object.assign(defaultSave().halloween, parsed.halloween||{}),
      stats:Object.assign(defaultSave().stats, parsed.stats||{}),
      settings:Object.assign(defaultSave().settings, parsed.settings||{}),
    });
  }catch(e){ return defaultSave(); }
}
function persist(){ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }
function applySettingsToDOM(){
  document.body.classList.toggle('reduce-fx', !SAVE.settings.animations || SAVE.settings.reduceEffects);
  document.body.classList.toggle('text-large', SAVE.settings.textSize==='large');
  document.body.classList.toggle('contrast-high', SAVE.settings.contrast==='high');
}

/* --------------------------- DATE / HALLOWEEN --------------------------- */
function isHalloweenNow(){
  const d = new Date();
  const m = d.getMonth()+1, day = d.getDate();
  return (m===10) || (m===11 && day<=2);
}
function applyThemeClass(){
  document.body.classList.toggle('halloween', isHalloweenNow());
  renderHalloweenFX();
}
function renderHalloweenFX(){
  const el = document.getElementById('fxHalloweenExtra');
  if(!isHalloweenNow()){ el.innerHTML=''; return; }
  let html='';
  const emojis=['🎃','🦇','🕸️','🍂','🕯️'];
  for(let i=0;i<10;i++){
    const e = emojis[i%emojis.length];
    const left = Math.random()*100;
    const dur = 6+Math.random()*8;
    const delay = Math.random()*6;
    const size = 1.2+Math.random()*1.6;
    html += `<div style="position:absolute; left:${left}%; top:${-10-Math.random()*20}%; font-size:${size}rem; animation:fall ${dur}s linear ${delay}s infinite;">${e}</div>`;
  }
  html += `<div style="position:absolute; top:6%; right:8%; font-size:2.4rem; animation:floaty 5s ease-in-out infinite; opacity:.8;">🌙</div>`;
  el.innerHTML = html;
}

  const src = CINE_MUSIC[key];
  if(!src) return;
  stopCineMusic();
  cineMusicEl = new Audio(src);
  cineMusicEl.loop = false;
  cineMusicEl.volume = (SAVE.settings && typeof SAVE.settings.musicVol==='number' ? SAVE.settings.musicVol : 60)/100;

function stopCineMusic(){
  if(!cineMusicEl) return;
  const el = cineMusicEl; cineMusicEl = null;
  let vol = el.volume;
  const fade = setInterval(()=>{
    vol -= 0.08;
    if(vol<=0){ clearInterval(fade); el.pause(); el.currentTime=0; }
    else { el.volume = vol; }
  }, 60);
}
function setCineMusicVolume(v){
  if(cineMusicEl) cineMusicEl.volume = v/100;
}

/* --------------------------- AUDIO (synthétisé, sans fichiers) --------------------------- */
let actx=null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq, dur, type='sine', vol=1){
  if(!SAVE.settings) return;
  ensureAudio(); if(!actx) return;
  const g = actx.createGain();
  const o = actx.createOscillator();
  o.type=type; o.frequency.value=freq;
  const v = (SAVE.settings.sfxVol/100) * vol * 0.18;
  g.gain.setValueAtTime(v, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+dur);
}

/* --------------------------- UTILS --------------------------- */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(pool,n){ return shuffle(pool).slice(0,Math.min(n,pool.length)); }
function pickLevelQuestions(mix){
  let picked = [];
  picked = picked.concat(sample(Q_ROUTE, mix.route||0));
  picked = picked.concat(sample(Q_SECOURS, mix.secours||0));
  return shuffle(picked).map(q=>{
    const idxs = shuffle([0,1,2,3]);
    const answers = idxs.map(i=>q.a[i]);
    const correct = idxs.indexOf(q.c);
    const flav = (q.cat==='route'?FLAVOR_ROUTE:FLAVOR_SECOURS);
    return {...q, answers, correct, flavor: flav[Math.floor(Math.random()*flav.length)]};
  });
}

function svgWrap(inner){ return `<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`; }
function carWreck(cx,cy,rot){ return `<g transform="translate(${cx},${cy}) rotate(${rot})"><rect x="-70" y="-20" width="140" height="45" rx="8" fill="var(--panel2)" stroke="var(--danger2)" stroke-opacity=".5" stroke-width="2"/><circle cx="-40" cy="26" r="14" fill="#000" fill-opacity=".6"/><circle cx="40" cy="26" r="14" fill="#000" fill-opacity=".6"/></g>`; }
function windowGrid(){ let s=''; for(let r=0;r<4;r++)for(let c=0;c<8;c++){ const lit=((r*8+c)%7===0); s+=`<rect x="${90+c*70}" y="${90+r*70}" width="26" height="34" fill="${lit?'var(--gold)':'#000'}" fill-opacity="${lit?0.45:0.55}"/>`; } return s; }
function rivets(){ let s=''; for(let i=0;i<6;i++){ s+=`<circle cx="280" cy="${110+i*55}" r="4" fill="var(--textdim)" fill-opacity=".6"/><circle cx="520" cy="${110+i*55}" r="4" fill="var(--textdim)" fill-opacity=".6"/>`; } return s; }
function ceilingLights(){ let s=''; for(let i=0;i<4;i++){ s+=`<rect x="${180+i*130}" y="20" width="60" height="10" fill="var(--gold)" fill-opacity=".5"><animate attributeName="fill-opacity" values=".6;.1;.6" dur="${1+i*0.4}s" repeatCount="indefinite"/></rect>`; } return s; }
function monitorGrid(){ let s=''; for(let r=0;r<2;r++)for(let c=0;c<6;c++){ s+=`<rect x="${100+c*100}" y="${100+r*110}" width="70" height="46" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-opacity=".4"><animate attributeName="fill-opacity" values=".18;.4;.18" dur="${2+((r+c)%3)}s" repeatCount="indefinite"/></rect>`; } return s; }
function shelfUnits(){ let s='<rect x="0" y="0" width="800" height="450" fill="#000" fill-opacity=".3"/>'; for(let i=0;i<6;i++){ const x=40+i*130; s+=`<rect x="${x}" y="60" width="16" height="360" fill="var(--panel2)"/><rect x="${x}" y="60" width="90" height="16" fill="var(--panel2)"/><rect x="${x}" y="160" width="90" height="16" fill="var(--panel2)"/><rect x="${x}" y="260" width="90" height="16" fill="var(--panel2)"/>`; } return s; }
function clockTicks(){ let s=''; for(let i=0;i<12;i++){ const a=i*30*Math.PI/180, x1=400+110*Math.sin(a), y1=220-110*Math.cos(a), x2=400+128*Math.sin(a), y2=220-128*Math.cos(a); s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--textdim)" stroke-opacity=".5" stroke-width="2"/>`; } return s; }

function scenePhotoPath(name){ return 'images/scene-'+name.replace(/_/g,'-')+'.jpg'; }
/* Charge une photo (embarquée en priorité, sinon fichier externe, sinon illustration générée)
   et l'affiche en fondu sur le calque photo courant. */
function setCinePhoto(name){
  if(!ST._cineEl) return;
  const layers = ST._cineEl.querySelectorAll('.cine-photo');
  if(layers.length<2 || ST._currentPhotoName===name) return;
  ST._currentPhotoName = name;
  const activeIdx = ST._cineActiveLayer||0;
  const nextIdx = activeIdx===0?1:0;
  const activeEl = layers[activeIdx], nextEl = layers[nextIdx];
  const crossfadeTo = (src)=>{
    nextEl.classList.remove('kb');
    nextEl.style.transition='none';
    nextEl.style.opacity='0';
    nextEl.style.zIndex='4';
    activeEl.style.zIndex='3';
    nextEl.src = src;
    const reveal = ()=>{
      void nextEl.offsetWidth; // force reflow avant de réactiver la transition
      nextEl.style.transition='opacity .6s ease';
      activeEl.style.transition='opacity .6s ease';
      nextEl.style.opacity='1';
      activeEl.style.opacity='0';
      requestAnimationFrame(()=>nextEl.classList.add('kb'));
      ST._cineActiveLayer = nextIdx;
    };
    // decode() garantit que l'image est prête à l'affichage avant le fondu (évite le clignotement/flash noir)
    if(nextEl.decode){ nextEl.decode().then(reveal).catch(reveal); } else { reveal(); }
  };
  // 1) image embarquée en base64 (fichier unique, toujours disponible)
  if(typeof IMAGE_DATA!=='undefined' && IMAGE_DATA[name]){ crossfadeTo(IMAGE_DATA[name]); return; }
  // 2) sinon, tente un fichier externe images/scene-<nom>.jpg puis .png
  const jpgSrc = scenePhotoPath(name);
  const tryLoad = (src, onFail)=>{
    const probe = new Image();
    probe.onload = ()=>crossfadeTo(src);
    probe.onerror = onFail;
    probe.src = src;
  };
  tryLoad(jpgSrc, ()=>{
    const pngSrc = jpgSrc.replace(/\.jpg$/i,'.png');
    // 3) sinon, on masque la photo : l'illustration générée en dessous reste visible
    tryLoad(pngSrc, ()=>{
      nextEl.style.transition='none'; nextEl.style.opacity='0'; nextEl.removeAttribute('src');
      activeEl.style.transition='opacity .4s ease'; activeEl.style.opacity='0';
      ST._cineActiveLayer = nextIdx;
    });
  });
}

/* ---- Particules Canvas (pluie / poussière / braises / éclats) ---- */
const PARTICLE_CONFIGS = {
  rain:{count:60,color:'rgba(200,210,255,.55)',speedMin:11,speedMax:19,len:20,dir:'down'},
  embers:{count:30,color:'255,150,40',speedMin:.4,speedMax:1.1,size:2.4,dir:'up',glow:true},
  dust:{count:34,color:'220,210,255',speedMin:.15,speedMax:.4,size:1.8,dir:'up'},
  motes:{count:22,color:'255,230,160',speedMin:.2,speedMax:.5,size:2.4,dir:'up',glow:true},
};
function initParticles(container, type){
  if(document.body.classList.contains('reduce-fx')) return null;
  const cfg = PARTICLE_CONFIGS[type]||PARTICLE_CONFIGS.dust;
  const canvas = document.createElement('canvas');
  canvas.className='cine-particles-canvas';
  container.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = container.clientWidth; canvas.height = container.clientHeight; }
  resize();
  const small = window.innerWidth < 480;
  const count = small ? Math.round(cfg.count*.55) : cfg.count;
  function spawn(){
    const w=canvas.width, h=canvas.height;
    if(cfg.dir==='down') return {x:Math.random()*w, y:Math.random()*-h, vy:cfg.speedMin+Math.random()*(cfg.speedMax-cfg.speedMin), sway:0};
    return {x:Math.random()*w, y:h+Math.random()*h, vy:cfg.speedMin+Math.random()*(cfg.speedMax-cfg.speedMin), sway:Math.random()*Math.PI*2, r:(cfg.size*.6)+Math.random()*cfg.size};
  }
  let particles = Array.from({length:count}, spawn);
  let raf, running=true;
  function tick(){
    if(!running) return;
    const w=canvas.width, h=canvas.height;
    ctx.clearRect(0,0,w,h);
    particles.forEach(p=>{
      if(cfg.dir==='down'){
        p.y += p.vy;
        if(p.y>h+20){ p.y=-20; p.x=Math.random()*w; }
        ctx.strokeStyle = cfg.color; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+3,p.y+cfg.len); ctx.stroke();
      } else {
        p.y -= p.vy; p.sway += .02;
        p.x += Math.sin(p.sway)*.4;
        if(p.y<-20){ p.y=h+20; p.x=Math.random()*w; }
        ctx.beginPath();
        if(cfg.glow){
          const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
          grad.addColorStop(0,'rgba('+cfg.color+',.9)'); grad.addColorStop(1,'rgba('+cfg.color+',0)');
          ctx.fillStyle = grad; ctx.arc(p.x,p.y,p.r*3,0,7); ctx.fill();
        } else {
          ctx.fillStyle='rgba('+cfg.color+',.5)'; ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
        }
      }
    });
    raf = requestAnimationFrame(tick);
  }
  tick();
  return { stop(){ running=false; cancelAnimationFrame(raf); canvas.remove(); } };
}

function playCinematic(lines, title, onDone, keyForCollection){
  ST.cineQueue = lines; ST.cineIdx=0; ST.cineOnDone = onDone; ST.cineTitle=title; ST.cineKey = keyForCollection||null;
  if(keyForCollection) markCine(keyForCollection);
  if(keyForCollection && CINE_MUSIC[keyForCollection]) playCineMusic(keyForCollection);
  renderCineFrame();
}
function renderCineFrame(){
  SFX.transition();
  const scene = getScene(ST.cineKey);
  const reduced = document.body.classList.contains('reduce-fx');
  const container = document.createElement('div');
  container.className='cine';
  container.innerHTML = `
    <div class="cine-bar top"></div>
    <div class="cine-bar bottom"></div>
    <div class="cine-stage" id="cineStage">
      <div class="cine-layer-far${reduced?'':' kenburns-a'}">${scene.far}</div>
      <div class="cine-layer-near${reduced?'':' kenburns-b'}">${scene.near}</div>
      <img class="cine-photo" id="cinePhotoA" alt="">
      <img class="cine-photo" id="cinePhotoB" alt="">
      <div class="cine-vignette-local"></div>
    </div>
    <div class="lightning" id="lightningFX"></div>
    ${ST.cineTitle?`<div class="levellabel">${ST.cineTitle}</div>`:''}
    <div class="cine-subtitle-wrap"><div class="cine-subtitle" id="cineSubtitle"></div></div>
    <div class="skip" onclick="skipCinematic()">Passer ▶</div>`;
  document.body.appendChild(container);
  ST._cineEl = container;
  ST._currentPhotoName = null;
  ST._cineActiveLayer = 0;
  ST._particleHandle = initParticles(container.querySelector('#cineStage'), scene.particle);
  // photo initiale : celle de la 1ère réplique si précisée, sinon la photo par défaut de la scène
  const firstImg = (ST.cineQueue[0] && ST.cineQueue[0].img) || scene.type;
  setCinePhoto(firstImg);
  requestAnimationFrame(()=>requestAnimationFrame(()=>container.classList.add('letterboxed')));
  showCineLines(0);
}
function triggerBeat(){
  if(document.body.classList.contains('reduce-fx')) { SFX.transition(); return; }
  const stage = ST._cineEl && ST._cineEl.querySelector('#cineStage');
  const flash = ST._cineEl && ST._cineEl.querySelector('#lightningFX');
  if(stage){ stage.classList.remove('shake-active'); void stage.offsetWidth; stage.classList.add('shake-active'); }
  if(flash){ flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on'); setTimeout(()=>flash.classList.remove('on'),220); }
  SFX.transition();
}
function showCineLines(i){
  ST.cineIdx = i;
  if(i>=ST.cineQueue.length){ finishCinematic(); return; }
  const line = ST.cineQueue[i];
  const wrap = ST._cineEl.querySelector('.cine-subtitle-wrap');
  const oldSub = ST._cineEl.querySelector('#cineSubtitle');
  const fresh = document.createElement('div');
  fresh.id='cineSubtitle'; fresh.className='cine-subtitle'+(line.radio?' radio':'');
  fresh.textContent = line.radio ? '📻 '+line.t : line.t;
  if(oldSub) oldSub.replaceWith(fresh); else wrap.appendChild(fresh);
  if(line.img) setCinePhoto(line.img);
  if(line.radio || line.beat) triggerBeat();
  clearTimeout(ST._cineTimer);
  const dur = Math.min(5200, Math.max(2200, line.t.length*45));
  ST._cineTimer = setTimeout(()=>showCineLines(i+1), dur);
}
function skipCinematic(){ showCineLines(ST.cineQueue.length); }
function finishCinematic(){
  clearTimeout(ST._cineTimer);
  if(ST._particleHandle){ ST._particleHandle.stop(); ST._particleHandle=null; }
  if(ST._cineEl){ ST._cineEl.remove(); ST._cineEl=null; }
  stopCineMusic();
  const cb = ST.cineOnDone; ST.cineOnDone=null;
  if(cb) cb();
}

  playCinematic(lines, "PROLOGUE — HALLOWEEN", cb, 'H_opening');
}
function playVictoryCinematic(){
  const lines = ST.mode==='halloween' ? HALLOWEEN_VICTORY : STORY_VICTORY;
  const key = ST.mode==='halloween' ? 'H_victory' : 'S_victory';

/* --------------------------- GAMEPLAY --------------------------- */
function startLevelGameplay(n){
  ST.level = n;
  const lvl = levelConf(n);
  ST.levelQuestions = pickLevelQuestions(lvl.mix);
  ST.qIndex = 0; ST.hearts = 3; ST.answered=false; ST.streak=0;
  go('gameplay');
}
function currentQ(){ return ST.mode==='free' ? ST.freeQuestions[ST.qIndex] : ST.levelQuestions[ST.qIndex]; }
function totalQ(){ return ST.mode==='free' ? ST.freeQuestions.length : ST.levelQuestions.length; }

function renderGameplay(){
  const q = currentQ();
  if(!q){ // safety
    if(ST.mode==='free'){ return renderFreeSummary(); }
    return afterLevelQuestionsDone();
  }
  const lvl = ST.mode!=='free' ? levelConf(ST.level) : null;
  const heartsHtml = '❤️'.repeat(ST.mode==='free'?0:ST.hearts) + '🖤'.repeat(ST.mode==='free'?0:(3-ST.hearts));
  const pct = Math.round((ST.qIndex)/totalQ()*100);
  app.innerHTML = `
  <div class="top-back" onclick="confirmQuit()">✕ Quitter</div>
  <div class="screen">
    <div class="wrap">
      <div class="hud">
        <div class="badge">${ST.mode==='free'?'MODE LIBRE':'NIVEAU '+ST.level+' — '+lvl.title}</div>
        ${ST.mode!=='free'?`<div class="hearts">${heartsHtml}</div>`:''}
        <div class="badge">SCORE : ${ST.score}</div>
      </div>
      <div class="progressbar"><div style="width:${pct}%"></div></div>
      <div class="panel">
        <div class="scene-flavor">${q.flavor}</div>
        <span class="question-cat ${q.cat}">${q.cat==='route'?'🚗 SÉCURITÉ ROUTIÈRE':'🚑 PREMIERS SECOURS'}</span>
        <div class="question-text">${q.q}</div>
        <div class="answers" id="answersBox">
          ${q.answers.map((ans,i)=>`<div class="ans-btn" data-i="${i}" onclick="answerQuestion(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${ans}</span></div>`).join('')}
        </div>
        <div id="feedbackBox"></div>
        <div class="streak" id="streakBox">${ST.streak>=2?'🔥 SÉRIE : '+ST.streak+' bonnes réponses !':''}</div>
      </div>
    </div>
  </div>`;
}

function answerQuestion(i){
  if(ST.answered) return;
  ST.answered = true;
  const q = currentQ();
  const boxes = document.querySelectorAll('#answersBox .ans-btn');
  boxes.forEach(b=>b.classList.add('disabled'));
  const good = i===q.correct;
  boxes[q.correct].classList.add('correct');
  if(!good) boxes[i].classList.add('wrong');

  const fb = document.getElementById('feedbackBox');
  if(good){
    SFX.correct();
    ST.streak++; ST.bestStreakRun = Math.max(ST.bestStreakRun, ST.streak);
    const base = 100 + (q.dif-1)*40;
    const streakBonus = ST.streak>=3 ? 50 : 0;
    ST.score += base + streakBonus;
    SAVE.stats.correct++;
    fb.innerHTML = `<div class="feedback ok"><div class="head ok">✅ BONNE RÉPONSE</div><div class="exp">${q.exp}</div></div>`;
  } else {
    SFX.wrong();
    ST.streak=0;
    SAVE.stats.wrong++;
    if(ST.mode!=='free'){
      ST.hearts--;
      document.querySelector('.hearts') && (document.querySelector('.hearts').textContent = '❤️'.repeat(Math.max(ST.hearts,0))+'🖤'.repeat(3-Math.max(ST.hearts,0)));
    }
    fb.innerHTML = `<div class="feedback ko"><div class="head ko">❌ MAUVAISE RÉPONSE</div>
      <div class="exp"><b>Bonne réponse :</b> ${q.answers[q.correct]}<br>${q.exp}
      ${ST.mode!=='free' ? '<br><br><i>Une vie a été perdue...</i>' : ''}</div></div>`;
  }
  SAVE.stats.bestStreak = Math.max(SAVE.stats.bestStreak, ST.bestStreakRun);
  persist();

  const cont = document.createElement('button');
  cont.className='btn primary'; cont.style.marginTop='14px'; cont.textContent='Continuer ▶';
  cont.onclick = nextStep;
  fb.appendChild(cont);
}

function nextStep(){
  if(ST.mode!=='free' && ST.hearts<=0){ go('defeat'); return; }
  ST.qIndex++;
  ST.answered=false;
  if(ST.qIndex >= totalQ()){
    if(ST.mode==='free'){ renderFreeSummary(); return; }
    afterLevelQuestionsDone();
    return;
  }
  render();
}

function afterLevelQuestionsDone(){
  // level completed successfully
  const store = ST.mode==='halloween' ? SAVE.halloween : SAVE.progress;
  store.unlockedLevel = Math.max(store.unlockedLevel, Math.min(ST.level+1,5));
  store.bestScore = Math.max(store.bestScore, ST.score);
  SAVE.score = Math.max(SAVE.score, ST.score);
  SAVE.stats.gamesPlayed++;
  persist();
  playLevelOutro(ST.level, ()=>{
    if(ST.level>=5){
      store.completed = true; persist();
      playVictoryCinematic();
    } else {
      const next = ST.level+1;
      playLevelIntro(next);
    }
  });
}

function confirmQuit(){
  SFX.click();
  showModal("Quitter la partie ?", "Votre progression jusqu'au niveau actuel est déjà sauvegardée. Voulez-vous retourner au menu ?", [
    {label:"Annuler", cls:"ghost"},

  ]);
}

  <div class="top-back" onclick="go('menu')">← Retour</div>
  <div class="screen">
    <div class="wrap panel">
      <h2>🎯 MODE LIBRE</h2>

      <h3>Catégorie</h3>
      <div class="seg">

        <button class="${ST.freeConfig.cat==='mix'?'active':''}" onclick="setFreeCat('mix')">🔀 Mélange</button>
      </div>

      <div class="seg">

function setFreeCat(c){ SFX.click(); ST.freeConfig.cat=c; render(); }
function setFreeCount(n){ SFX.click(); ST.freeConfig.count=n; render(); }
function startFreeMode(){
  SFX.click();
  ST.mode='free';
  let pool = ST.freeConfig.cat==='route'?Q_ROUTE : ST.freeConfig.cat==='secours'?Q_SECOURS : QUESTIONS;
  const n = ST.freeConfig.count===999 ? pool.length*3 : ST.freeConfig.count;
  // build with repeats allowed if requesting more than pool size (endless-ish)
  let list = [];
  while(list.length < n){ list = list.concat(shuffle(pool)); }
  list = list.slice(0,n);
  ST.freeQuestions = list.map(q=>{
    const idxs = shuffle([0,1,2,3]);
    const answers = idxs.map(i=>q.a[i]);
    const correct = idxs.indexOf(q.c);
    const flav = (q.cat==='route'?FLAVOR_ROUTE:FLAVOR_SECOURS);
    return {...q, answers, correct, flavor: flav[Math.floor(Math.random()*flav.length)]};
  });
  ST.qIndex=0; ST.score=0; ST.streak=0; ST.answered=false;
  go('gameplay');
}

  app.innerHTML = `

  SAVE.stats.gamesPlayed++; persist();
}

  const all = [

    ...HALLOWEEN_LEVELS.map(l=>({k:'H_'+l.key+'_outro', lines:l.outro, title:null})),
    {k:'S_victory', lines:STORY_VICTORY, title:'ÉPILOGUE'},

function updateSetting(key,val){ SAVE.settings[key]=parseInt(val); persist(); if(key==='musicVol') setCineMusicVolume(SAVE.settings[key]); }
function toggleSetting(key){ SFX.click(); SAVE.settings[key]=!SAVE.settings[key]; persist(); render(); }
function setSetting(key,val){ SFX.click(); SAVE.settings[key]=val; persist(); render(); }

function exportSave(){
  SFX.click();
  const blob = new Blob([JSON.stringify(SAVE,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='albain-horror-save.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importSaveFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      showModal("Importer la sauvegarde ?", "Cette action va écraser votre sauvegarde actuelle sur cet appareil. Voulez-vous continuer ?", [
        {label:"Annuler", cls:"ghost"},
        {label:"Importer", cls:"primary", action:()=>{
          SAVE = Object.assign(defaultSave(), data);
          persist(); render();
        }}
      ]);
    }catch(err){ alert("Fichier de sauvegarde invalide."); }
  };
  reader.readAsText(file);
}
function confirmReset(){
  SFX.click();
  showModal("Réinitialiser la sauvegarde ?", "Toute votre progression (niveaux, score, collection) sera définitivement supprimée sur cet appareil.", [
    {label:"Annuler", cls:"ghost"},
    {label:"Continuer", cls:"danger", action:()=>{
      showModal("Confirmation finale", "Êtes-vous vraiment sûr ? Cette action est irréversible.", [
        {label:"Annuler", cls:"ghost"},
        {label:"RÉINITIALISER", cls:"danger", action:()=>{ SAVE = defaultSave(); persist(); go('menu'); }}
      ]);
    }}
  ]);
}

/* --------------------------- MODAL --------------------------- */
function showModal(title, text, buttons){
  const bg = document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML = `<div class="modal">
    <h3 style="margin-top:0;color:var(--gold);">${title}</h3>
    <p class="small-note">${text}</p>
    <div class="btn-row" id="modalBtns"></div>
  </div>`;
  document.body.appendChild(bg);
  const row = bg.querySelector('#modalBtns');
  buttons.forEach(b=>{
    const btn=document.createElement('button');
    btn.className='btn '+(b.cls||'');
    btn.textContent=b.label;
    btn.onclick=()=>{ bg.remove(); if(b.action) b.action(); };
    row.appendChild(btn);
  });
}
